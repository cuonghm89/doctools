name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: swift build
        run: swift build

      - name: pip install PythonEngine deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r PythonEngine/requirements.txt

      - name: Chạy self-check PythonEngine (test_*.py, không dùng pytest)
        run: |
          set -e
          cd PythonEngine
          for f in test_*.py; do
            echo "== $f =="
            python3 "$f"
          done
