name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: swift build
        run: swift build

      # python3 hệ thống của runner chặn pip install trực tiếp (PEP 668,
      # "externally-managed-environment") -> phải cài qua venv.
      - name: pip install PythonEngine deps
        run: |
          python3 -m venv PythonEngine/.venv
          PythonEngine/.venv/bin/pip install --upgrade pip
          PythonEngine/.venv/bin/pip install -r PythonEngine/requirements.txt

      - name: Chạy self-check PythonEngine (test_*.py, không dùng pytest)
        run: |
          set -e
          cd PythonEngine
          for f in test_*.py; do
            echo "== $f =="
            .venv/bin/python3 "$f"
          done
